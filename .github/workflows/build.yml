name: Build ImmortalWrt 24.10.6 x86_64

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: 'Rootfs size (MB)'
        required: true
        default: '4096'
      include_docker:
        description: 'Include Docker'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: 'Configure PPPoE?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_wan_account:
        description: 'PPPoE WAN account'
        required: false
      pppoe_wan_password:
        description: 'PPPoE WAN password'
        required: false
      pppoe_wanb_account:
        description: 'PPPoE WANB account (second line)'
        required: false
      pppoe_wanb_password:
        description: 'PPPoE WANB password (second line)'
        required: false
      enable_store:
        description: 'Include iStore app store (third-party packages)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Show initial disk usage
      run: |
        echo "=== 初始磁盘状态 ==="
        df -hT
        echo "====================="

    # 第一轮：清理各类工具链缓存 (npm/homebrew/apt/docker/os-swap)
    - name: Optimize disk space (round 1)
      uses: hugoalh/disk-space-optimizer-ghaction@v0.8.1
      with:
        operate_sudo: 'True'
        general_include: '.+'
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: '.+'
        docker_prune: 'True'
        docker_clean: 'True'
        apt_prune: 'True'
        apt_clean: 'True'
        homebrew_prune: 'True'
        homebrew_clean: 'True'
        npm_prune: 'True'
        npm_clean: 'True'
        os_swap: 'True'

    # 第二轮：移除大型 SDK + LVM 扩容
    - name: Maximize build disk space (round 2)
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 3072
        swap-size-mb: 4096
        overprovision-lvm: 'true'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Show disk usage after cleanup
      run: |
        echo "=== 清理后磁盘状态 ==="
        df -hT
        echo "======================="

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 将临时目录指向 Runner 主磁盘，避开 /tmp tmpfs 限制
        export TMPDIR=$RUNNER_TEMP
        sudo mkdir -p $TMPDIR

        # 彻底清理 APT 缓存
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*

        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler e2fsprogs fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
          libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
          lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-pyelftools python3-setuptools qemu-utils re2c rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
          xxd zlib1g-dev zstd

        # 安装后再次清理，防止后续步骤空间不足
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*
        df -hT / /workdir 2>/dev/null || df -hT /
        echo "--- Build dependencies installed, disk status above ---"

        echo "=== 安装依赖后磁盘状态 ==="
        df -hT
        echo "==========================="

    - name: Setup build environment
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Checkout
      uses: actions/checkout@v6

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Restore source download cache
      uses: actions/cache/restore@v5
      with:
        path: /workdir/openwrt/dl
        key: dl-${{ env.REPO_BRANCH }}-${{ hashFiles('.config') }}
        restore-keys: |
          dl-${{ env.REPO_BRANCH }}-
          ccache-${{ env.REPO_BRANCH }}-

    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: ~/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ hashFiles('.config') }}
        restore-keys: |
          ccache-${{ env.REPO_BRANCH }}-

    - name: Generate PPPoE settings
      if: github.event.inputs.enable_pppoe == 'yes'
      run: |
        mkdir -p files/etc/config
        cat > files/etc/config/pppoe-settings << 'PPEOF'
        enable_pppoe="yes"
        PPPOE_WAN_ACCOUNT
        PPPOE_WAN_PASSWORD
        PPPOE_WANB_ACCOUNT
        PPPOE_WANB_PASSWORD
        PPEOF
        sed -i "s|PPPOE_WAN_ACCOUNT|pppoe_wan_account=\"${{ github.event.inputs.pppoe_wan_account }}\"|" files/etc/config/pppoe-settings
        sed -i "s|PPPOE_WAN_PASSWORD|pppoe_wan_password=\"${{ github.event.inputs.pppoe_wan_password }}\"|" files/etc/config/pppoe-settings
        sed -i "s|PPPOE_WANB_ACCOUNT|pppoe_wanb_account=\"${{ github.event.inputs.pppoe_wanb_account }}\"|" files/etc/config/pppoe-settings
        sed -i "s|PPPOE_WANB_PASSWORD|pppoe_wanb_password=\"${{ github.event.inputs.pppoe_wanb_password }}\"|" files/etc/config/pppoe-settings
        echo "PPPoE settings file generated"

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Enable Store integration
      if: github.event.inputs.enable_store == 'true'
      run: |
        if ! grep -q 'luci-app-store' shell/custom-packages.sh 2>/dev/null; then
          echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
          echo "istore enabled"
        fi

    - name: Load custom configuration
      env:
        INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download all sources
      working-directory: openwrt
      run: |
        echo "=== 下载前磁盘状态 ==="
        df -hT .
        echo "======================="
        make download -j$(nproc) V=s
        echo "=== 下载后磁盘状态 ==="
        df -hT .
        echo "======================="

    - name: Save source download cache
      uses: actions/cache/save@v5
      if: '!cancelled()'
      with:
        path: /workdir/openwrt/dl
        key: dl-${{ env.REPO_BRANCH }}-${{ hashFiles('.config') }}

    - name: Compile the firmware
      id: compile
      working-directory: openwrt
      run: |
        echo "=== 编译前磁盘状态 ==="
        df -hT .
        echo "======================="
        make defconfig
        echo "$(nproc) thread compile"
        if ! make -j$(nproc) V=s; then
          echo "Parallel build failed, retrying with single thread..."
          make -j1 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: '!cancelled()'
      run: df -hT

    - name: Save ccache
      uses: actions/cache/save@v5
      if: '!cancelled()'
      with:
        path: ~/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ hashFiles('.config') }}

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && success()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true' && success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: immortalwrt-24.10.6-${{ github.run_number }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        KEEP_LATEST=3
        gh release list --limit 100 --json tagName --jq '.[].tagName' \
          | tail -n +$((KEEP_LATEST + 1)) \
          | while read tag; do
              [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            done

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
