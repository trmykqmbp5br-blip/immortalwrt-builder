name: Build ImmortalWrt 24.10.6 x86_64

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: 'Rootfs size (MB)'
        required: true
        default: '4096'
      include_docker:
        description: 'Include Docker'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 540

    steps:
    - name: Prepare environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "=== 释放磁盘空间 ==="
        sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /usr/local/.ghcup /usr/local/julia* /opt/ghc
        sudo docker image prune --all --force 2>/dev/null || true
        sudo swapoff -a 2>/dev/null || true
        sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none 2>/dev/null
        sudo mkswap /swapfile 2>/dev/null && sudo swapon /swapfile 2>/dev/null
        echo "=== 安装构建依赖 ==="
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        sudo apt-get update -y || {
          echo "apt-get update timeout, retrying..."
          sudo apt-get update -y
        }
        sudo apt-get install -y --no-install-recommends \
          antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler e2fsprogs fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
          libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
          lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-pyelftools python3-setuptools qemu-utils re2c rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
          xxd zlib1g-dev zstd
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*
        df -hT /

    - name: Checkout
      uses: actions/checkout@v6

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 获取日期（与 ccache 一致）
    - name: Get date for dl cache key
      id: dl-date
      run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

    # 恢复缓存
    - name: Restore dl cache
      uses: actions/cache/restore@v5
      with:
        path: /workdir/openwrt/dl/
        key: dl-${{ env.REPO_BRANCH }}-${{ steps.dl-date.outputs.date }}-${{ hashFiles('feeds.conf.default', 'diy-part1.sh') }}
        restore-keys: |
          dl-${{ env.REPO_BRANCH }}-${{ steps.dl-date.outputs.date }}-
          dl-${{ env.REPO_BRANCH }}-

    - name: Get date for ccache key
      id: ccache-date
      run: echo "date=$(/bin/date -u "+%Y%m%d")" >> "$GITHUB_OUTPUT"

    - name: Configure feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        bash -c './scripts/feeds update -a'

    - name: Install feeds
      run: bash -c 'cd openwrt && ./scripts/feeds install -a'

    - name: Apply custom config
      env:
        INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        chmod +x diy-part2.sh  # 确保脚本可执行
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: ccache cache
      uses: actions/cache@v5
      with:
        path: /home/runner/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ steps.ccache-date.outputs.date }}-${{ hashFiles('feeds.conf.default', 'diy-part1.sh') }}
        restore-keys: |
          ccache-${{ env.REPO_BRANCH }}-${{ steps.ccache-date.outputs.date }}-
          ccache-${{ env.REPO_BRANCH }}-

    - name: Download sources
      working-directory: /workdir/openwrt
      run: |
        echo "=== 下载前 ==="
        df -hT .
        make download -j$(nproc) V=s
        echo "=== 下载后 ==="
        df -hT .

    # 构建成功时保存（key 含日期，每天可写入一条新缓存）
    - name: Save dl cache on success
      if: success()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: /workdir/openwrt/dl/
        key: dl-${{ env.REPO_BRANCH }}-${{ steps.dl-date.outputs.date }}-${{ hashFiles('feeds.conf.default', 'diy-part1.sh') }}

    # 构建失败时保存（带 -failed- 后缀，不冲突）
    - name: Save dl cache on failure
      if: failure()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: /workdir/openwrt/dl/
        key: dl-${{ env.REPO_BRANCH }}-${{ steps.dl-date.outputs.date }}-${{ hashFiles('feeds.conf.default', 'diy-part1.sh') }}-failed-${{ github.run_number }}

    - name: Compile firmware
      id: compile
      working-directory: /workdir/openwrt
      env:
        CCACHE_DIR: /home/runner/.ccache
      run: |
        mkdir -p "$CCACHE_DIR"
        # 确保 runner 用户有写权限
        sudo chown -R runner:runner /home/runner/.ccache 2>/dev/null || true
        chmod -R 777 /home/runner/.ccache 2>/dev/null || true
        # 重置计数器，编译结束后的 ccache -s 才能真实反映本次构建命中情况
        ccache -z
        ccache -M 5G
        ccache -s
        echo "2 thread compile"
        # 将 GITHUB_ENV 指向 /dev/null，吸收编译过程中子脚本的所有环境变量写入
        export GITHUB_ENV=/dev/null
        if ! make -j2 V=1; then
          echo "Parallel build failed, retrying with single thread..."
          make -j1 V=1 || exit $?
        fi

    - name: ccache stats & maintenance
      if: always()
      run: |
        echo "=== ccache stats ==="
        ccache -s 2>/dev/null || true
        SIZE=$(ccache -s 2>/dev/null | grep -i 'cache size' | grep -oP '[\d.]+(?=\s*G)' || echo "0")
        if [ -n "$SIZE" ] && [ "$(echo "$SIZE > 6" | bc 2>/dev/null)" = "1" ]; then
          echo "ccache exceeds 6GB ($SIZE GB), clearing..."
          ccache -C 2>/dev/null || true
        fi

    - name: Save ccache on failure
      if: failure()
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: /home/runner/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ steps.ccache-date.outputs.date }}-${{ hashFiles('feeds.conf.default', 'diy-part1.sh') }}-failed-${{ github.run_number }}

    - name: Verify binary injection
      run: |
        MANIFEST="$GITHUB_WORKSPACE/binary-manifest.json"
        if [ ! -f "$MANIFEST" ]; then
          echo "No binary-manifest.json found, skipping verification"
          exit 0
        fi
        SKIPPED=$(jq -r '.summary.total_skipped // 0' "$MANIFEST")
        if [ "$SKIPPED" -gt 0 ]; then
          echo "⚠ $SKIPPED package(s) were skipped during binary injection:" >> $GITHUB_STEP_SUMMARY
          jq -r '.packages | to_entries[] | select(.value.status == "skipped" or .value.status == "no_source" or .value.status == "bad_source") | "  - \(.key): \(.value.source)"' "$MANIFEST" >> $GITHUB_STEP_SUMMARY
        else
          echo "All binary packages injected successfully."
        fi

    - name: Release firmware
      if: success()
      env:
        GH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd /workdir/openwrt/bin/targets/x86/64/
        IMG_FILE=$(find . -name "*combined*img.gz" -type f | head -n 1)
        BIN_FILE=$(find . -name "*sysupgrade.bin" -type f | head -n 1)
        TAG="v24.10.6-$(date +%Y%m%d-%H%M)"
        TITLE="ImmortalWrt 24.10.6 Build $(date +%Y-%m-%d)"
        cat > release_notes.md << 'NOTEEOF'
        **immortalwrt-24.10.6-x86-64-generic-squashfs-combined.img.gz** - 物理刷机
        **immortalwrt-24.10.6-x86-64-generic-squashfs-sysupgrade.bin** - 在线升级
        NOTEEOF
        echo "Creating release ${TAG}..."
        gh release create "${TAG}" ${IMG_FILE} ${BIN_FILE} --title "${TITLE}" --notes-file release_notes.md
        echo "Cleaning up old releases (keep latest 3)..."
        gh release list --limit 50 | tail -n +4 | awk '{print $1}' | while read -r tag; do
          gh release delete "${tag}" -y
        done
