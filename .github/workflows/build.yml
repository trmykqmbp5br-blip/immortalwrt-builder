name: Build ImmortalWrt 24.10.6 x86_64

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: 'Rootfs size (MB)'
        required: true
        default: '4096'
      include_docker:
        description: 'Include Docker'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: 'Configure PPPoE?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_wan_account:
        description: 'PPPoE WAN account'
        required: false
      pppoe_wan_password:
        description: 'PPPoE WAN password'
        required: false
      pppoe_wanb_account:
        description: 'PPPoE WANB account (second line)'
        required: false
      pppoe_wanb_password:
        description: 'PPPoE WANB password (second line)'
        required: false
      enable_store:
        description: 'Include iStore app store (third-party packages)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo upx-ucl unzip vim wget xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache ccache and dl
      uses: actions/cache@v4
      with:
        path: |
          /workdir/openwrt/dl
          ~/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ hashFiles('.config') }}
        restore-keys: |
          ccache-${{ env.REPO_BRANCH }}-

    - name: Generate PPPoE settings
      if: github.event.inputs.enable_pppoe == 'yes'
      run: |
        mkdir -p files/etc/config
        cat > files/etc/config/pppoe-settings << 'PPEOF'
        enable_pppoe="yes"
        PPPOE_WAN_ACCOUNT
        PPPOE_WAN_PASSWORD
        PPPOE_WANB_ACCOUNT
        PPPOE_WANB_PASSWORD
        PPEOF
        sed -i "s|PPPOE_WAN_ACCOUNT|pppoe_wan_account=\"${{ github.event.inputs.pppoe_wan_account }}\"|" files/etc/config/pppoe-settings
        sed -i "s|PPPOE_WAN_PASSWORD|pppoe_wan_password=\"${{ github.event.inputs.pppoe_wan_password }}\"|" files/etc/config/pppoe-settings
        sed -i "s|PPPOE_WANB_ACCOUNT|pppoe_wanb_account=\"${{ github.event.inputs.pppoe_wanb_account }}\"|" files/etc/config/pppoe-settings
        sed -i "s|PPPOE_WANB_PASSWORD|pppoe_wanb_password=\"${{ github.event.inputs.pppoe_wanb_password }}\"|" files/etc/config/pppoe-settings
        echo "PPPoE settings file generated"
        # WARNING: Credentials may appear in workflow logs.
        # Consider using GitHub Secrets for production use:
        #   secrets.PPPOE_WAN_ACCOUNT / secrets.PPPOE_WAN_PASSWORD
        #   secrets.PPPOE_WANB_ACCOUNT / secrets.PPPOE_WANB_PASSWORD

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Enable Store integration
      if: github.event.inputs.enable_store == 'true'
      run: |
        if ! grep -q 'luci-app-store' shell/custom-packages.sh 2>/dev/null; then
          echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
          echo "istore enabled"
        fi

    - name: Load custom configuration
      env:
        INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: '!cancelled()'
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: immortalwrt-24.10.6-${{ github.run_number }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v1
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
