name: Build ImmortalWrt 24.10.6 x86_64

on:
  workflow_dispatch:
    inputs:
      rootfs_size:
        description: 'Rootfs size (MB)'
        required: true
        default: '4096'
      include_docker:
        description: 'Include Docker'
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write
  actions: write

env:
  INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Prepare environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "=== 释放磁盘空间 ==="
        sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android /usr/local/share/powershell /usr/local/.ghcup /usr/local/julia* /opt/ghc
        sudo docker image prune --all --force 2>/dev/null || true
        sudo swapoff -a 2>/dev/null || true
        sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none 2>/dev/null
        sudo mkswap /swapfile 2>/dev/null && sudo swapon /swapfile 2>/dev/null
        echo "=== 安装构建依赖 ==="
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        timeout 120 sudo apt-get update -y || {
          echo "apt-get update timeout, retrying..."
          timeout 120 sudo apt-get update -y
        }
        timeout 300 sudo apt-get install -y --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler e2fsprogs fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
          libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
          lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-pyelftools python3-setuptools qemu-utils re2c rsync \
          scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
          xxd zlib1g-dev zstd
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*
        df -hT /

    - name: Checkout
      uses: actions/checkout@v6

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        timeout 300 git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Calculate Toolchain Hash
      run: |
        cd /workdir/openwrt
        # 获取 tools 和 toolchain 目录的最新 commit 短哈希
        TOOLCHAIN_HASH=$(git log --pretty=tformat:"%h" -n1 tools toolchain 2>/dev/null || echo "unknown")
        echo "TOOLCHAIN_HASH=$TOOLCHAIN_HASH" >>$GITHUB_ENV
        echo "Toolchain hash: $TOOLCHAIN_HASH"

    # ============= 1. 恢复 dl 缓存 =============
    - name: Restore dl cache
      id: restore-dl
      uses: actions/cache/restore@v5
      with:
        path: /workdir/openwrt/dl
        key: dl-${{ env.REPO_BRANCH }}-${{ env.INCLUDE_DOCKER }}-${{ github.run_id }}
        restore-keys: |
          dl-${{ env.REPO_BRANCH }}-${{ env.INCLUDE_DOCKER }}-

    # ============= 恢复 toolchain 缓存 =============
    - name: Restore toolchain cache
      id: restore-toolchain
      uses: actions/cache/restore@v5
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        # Key 由分支 + tools/toolchain 的 git hash 决定
        key: toolchain-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}
        # 注意：没有 restore-keys！必须精确匹配，不能用旧工具链！

    - name: Skip tools & toolchain compilation if cache hit
      if: steps.restore-toolchain.outputs.cache-hit == 'true'
      run: |
        cd /workdir/openwrt
        # 和 cachewrtbuild 一样的 sed 命令，从顶层 Makefile 中去掉 stamp-compile 依赖
        sed -i 's/ $(toolchain\/stamp-compile)//;' Makefile
        sed -i 's/ $(tools\/stamp-compile)//;' Makefile
        echo "Toolchain building skipped due to cache hit"

    - name: Defconfig
      run: |
        cd /workdir/openwrt
        # 用 defconfig 自动补全 .config 中缺失的依赖，不会弹出图形界面
        make defconfig

    - name: Compile tools and toolchain
      run: |
        cd /workdir/openwrt
        if [ "${{ steps.restore-toolchain.outputs.cache-hit }}" == "true" ]; then
          echo "🎯 Toolchain cache hit! Skipping compilation."
        else
          echo "⚙️ Toolchain cache miss. Compiling tools and toolchain..."
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s
        fi

    # ============= 1. 恢复 ccache =============
    - name: Restore ccache
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ~/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}-

    - name: Configure
      env:
        INCLUDE_DOCKER: ${{ github.event.inputs.include_docker }}
        ROOTFS_SIZE: ${{ github.event.inputs.rootfs_size }}
        CCACHE_DIR: /home/runner/.ccache
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P1_SH $DIY_P2_SH
        cd openwrt
        timeout 60 $GITHUB_WORKSPACE/$DIY_P1_SH
        timeout 600 bash -c './scripts/feeds update -a'
        timeout 600 bash -c './scripts/feeds install -a'
        timeout 600 $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download sources
      working-directory: /workdir/openwrt
      run: |
        echo "=== 下载前 ==="
        df -hT .
        timeout 1800 make download -j$(nproc) V=s
        echo "=== 下载后 ==="
        df -hT .

    - name: Compile the firmware
      id: compile
      working-directory: /workdir/openwrt
      run: |
        timeout 120 make defconfig
        echo "$(nproc) thread compile"
        if ! timeout 14400 make -j$(nproc) V=s; then
          echo "Parallel build failed, retrying with single thread..."
          timeout 28800 make -j1 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ============= 2. 保存 dl 缓存（编译成功后才存） =============
    # ============= 清理 dl 缓存（超 2G 删最旧，先删后存防误伤） =============
    - name: Clean old dl caches
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PREFIX="dl-${{ env.REPO_BRANCH }}-${{ env.INCLUDE_DOCKER }}-"
        gh cache list --limit 100 --json id,key,sizeInBytes,createdAt \
          --jq ".[] | select(.key | startswith(\"$PREFIX\")) | {id,key,sizeInBytes,createdAt}" \
          | jq -s 'sort_by(.createdAt) | reverse' > /tmp/dl_caches.json
        TOTAL=$(jq '[.[].sizeInBytes] | add // 0' /tmp/dl_caches.json)
        echo "dl caches total: $(numfmt --to=iec $TOTAL)"
        if [ "$TOTAL" -gt 2147483648 ]; then
          echo "over 2G, deleting oldest..."
          jq -r '.[:-1][] | .id' /tmp/dl_caches.json | while read id; do
            gh cache delete "$id" && echo "  deleted $id"
          done
        fi

    - name: Save dl cache
      if: steps.compile.outcome == 'success' && !cancelled()
      uses: actions/cache/save@v5
      with:
        path: /workdir/openwrt/dl
        key: dl-${{ env.REPO_BRANCH }}-${{ env.INCLUDE_DOCKER }}-${{ github.run_id }}

    # ============= 清理 ccache 缓存（超 2G 删最旧，先删后存防误伤） =============
    - name: Clean old ccache caches
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PREFIX="ccache-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}-"
        gh cache list --limit 100 --json id,key,sizeInBytes,createdAt \
          --jq ".[] | select(.key | startswith(\"$PREFIX\")) | {id,key,sizeInBytes,createdAt}" \
          | jq -s 'sort_by(.createdAt) | reverse' > /tmp/ccache_caches.json
        TOTAL=$(jq '[.[].sizeInBytes] | add // 0' /tmp/ccache_caches.json)
        echo "ccache caches total: $(numfmt --to=iec $TOTAL)"
        if [ "$TOTAL" -gt 2147483648 ]; then
          echo "over 2G, deleting oldest..."
          jq -r '.[:-1][] | .id' /tmp/ccache_caches.json | while read id; do
            gh cache delete "$id" && echo "  deleted $id"
          done
        fi

    - name: Save ccache
      continue-on-error: true
      if: steps.compile.outcome == 'success' && !cancelled()
      uses: actions/cache/save@v5
      with:
        path: ~/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}-${{ github.run_id }}

    # ============= 保存 toolchain 缓存 =============
    - name: Save toolchain cache
      # 只有未命中缓存且运行未取消时才保存
      if: steps.restore-toolchain.outputs.cache-hit != 'true' && !cancelled()
      uses: actions/cache/save@v5
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/tool*
        key: toolchain-${{ env.REPO_BRANCH }}-${{ env.TOOLCHAIN_HASH }}

    - name: 固件地址
      if: env.UPLOAD_RELEASE == 'true' && success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd /workdir/openwrt/bin/targets/*/*
        FACTORY=$(ls ./*squashfs-combined-efi.img.gz)
        TAG="immortalwrt-24.10.6-${{ github.run_number }}"
        cp "$FACTORY" "/tmp/${TAG}-shuaji.img.gz"
        RELEASE_FILES="/tmp/${TAG}-shuaji.img.gz"
        SYSupgrade=$(ls ./*squashfs-sysupgrade.* 2>/dev/null || true)
        if [ -n "$SYSupgrade" ]; then
          SUFFIX="${SYSupgrade#*squashfs-sysupgrade}"
          cp "$SYSupgrade" "/tmp/${TAG}-zaixian${SUFFIX}"
          RELEASE_FILES="$RELEASE_FILES /tmp/${TAG}-zaixian${SUFFIX}"
        fi
        gh release create "$TAG" \
          --repo ${{ github.repository }} \
          --title "ImmortalWrt 24.10.6-${{ github.run_number }}" \
          --notes-file "$GITHUB_WORKSPACE/release.txt" \
          $RELEASE_FILES
        echo "=== 清理旧 Release ==="
        gh release list --limit 100 --json tagName --jq '.[].tagName' \
          | tail -n +4 \
          | while read tag; do
              [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
            done

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
